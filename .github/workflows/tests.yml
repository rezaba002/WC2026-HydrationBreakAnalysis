name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Most tests validate the committed tables in data/processed/ and need
      # nothing external. The clock-artefact regression tests additionally need
      # tournament metadata (match_events.csv, teams.csv), which is NOT
      # committed — provider data is not redistributed from this repository.
      # Fetch just those two CSVs from the public upstream dataset so those
      # tests actually run in CI. continue-on-error only defers the failure —
      # the next step turns a missing fetch into a hard failure, so a green
      # badge can never mean "the core regression tests were skipped".
      - name: Fetch external tournament metadata (public, not redistributed here)
        continue-on-error: true
        run: bash scripts/fetch_external.sh --metadata-only

      # A green badge must not be achievable by skipping the core regression
      # tests. If the metadata fetch failed, the clock-artefact and control-pool
      # tests would silently skip and CI would still pass - so fail here first.
      - name: Require external metadata (no silently-skipped core tests)
        run: |
          if [ ! -f external/FIFA-World-Cup-2026-Dataset/match_events.csv ]; then
            echo "::error::External metadata missing. The clock-artefact and"
            echo "::error::control-pool regression tests would skip, so CI would be"
            echo "::error::green without having run them. Failing deliberately."
            exit 1
          fi
          echo "external metadata present - all tests will run"

      - name: Run tests (skips are failures)
        run: python -m pytest tests -q -rs -W error::UserWarning

      # Belt and braces: assert nothing skipped, whatever the reason.
      - name: Assert no tests were skipped
        run: |
          python -m pytest tests -q --no-header -rs > out.txt 2>&1 || true
          cat out.txt
          if grep -qiE '[0-9]+ skipped' out.txt; then
            echo "::error::Some tests skipped - CI must not be green on skipped tests."
            exit 1
          fi
