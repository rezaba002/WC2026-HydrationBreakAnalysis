name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Most tests validate the committed tables in data/processed/ and need
      # nothing external. The clock-artefact regression tests additionally need
      # tournament metadata (match_events.csv, teams.csv), which is NOT
      # committed — provider data is not redistributed from this repository.
      # Fetch just those two CSVs from the public upstream dataset so those
      # tests actually run in CI. If this step fails the suite still passes;
      # the affected module skips itself rather than erroring.
      - name: Fetch external tournament metadata (public, not redistributed here)
        continue-on-error: true
        run: bash scripts/fetch_external.sh --metadata-only

      - name: Report which optional data is present
        run: |
          test -f external/FIFA-World-Cup-2026-Dataset/match_events.csv \
            && echo "external metadata present - clock-artefact tests will run" \
            || echo "external metadata absent - those tests will skip"

      - name: Run tests
        run: python -m pytest tests -q -rs
